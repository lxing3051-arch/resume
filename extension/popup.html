<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .preview {
        background: #f1f5f9;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
        max-height: 120px;
        overflow: auto;
        font-size: 12px;
      }
      .preview strong {
        display: block;
        margin-bottom: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
      }
      .primary {
        background: #2563eb;
        color: #fff;
      }
      .ghost {
        background: #e2e8f0;
      }
      .status {
        color: #64748b;
        font-size: 12px;
        min-height: 18px;
      }
      a {
        color: #2563eb;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>秋招助手采集</h1>
    <div id="status" class="status">正在读取页面...</div>
    <div id="preview" class="preview" hidden></div>
    <button id="importBtn" class="primary" hidden>打开秋招助手并导入</button>
    <button id="copyBtn" class="ghost" hidden>复制到剪贴板</button>
    <p><a href="options.html" target="_blank">设置秋招助手地址</a></p>
    <script src="popup.js"></script>
  </body>
</html>
